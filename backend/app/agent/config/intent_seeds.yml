# ============================================================
# 意图分类的语义种子句（关键词规则不命中时用它做向量匹配）
#
# 为什么有这个文件：
#   关键词规则只能枚举「明确说法」，遇到「开销/账目/开支」这类同义词就漏；
#   而生成模型做三分类实测只有 50.7%（199 条人工标注数据），基本是掷硬币。
#   把每类的**典型说法**embed 成向量，用户的话和哪个最像就归哪类 ——
#   零样本泛化、确定性输出、不占显存、可解释（能看出最像哪句）。
#
# 维护方式：**只加句子，不用改代码**。发现哪类总判错，就往对应类别补种子。
#   同义词、口语、书面语都要覆盖；重点覆盖「容易和别类混淆」的说法
#   （如 operation 的「刚从X回来」——语义像 travel，实际是记足迹）。
#   原则：按**语义正确性**放，不要为了拟合可疑标签而把句子塞进不匹配的类别。
# ============================================================

operation:
  # ---- 记账 / 查账 ----
  - 帮我记一笔账
  - 我花了50块吃饭
  - 这次出门一共花了多少
  - 上个月的开销是多少
  - 我的消费记录
  - 统计一下我这个月的花销
  - 我想看看我的账单明细
  - 查一下我的开销
  - 我把钱都花在哪了
  - 帮我算算总共花了多少
  - 这几个月花出去多少钱
  - 这趟旅行的费用
  - 帮我核一下这几次的账
  - 这趟的开销统计给我看看
  # ---- 足迹记录 / 查询（易与 travel 混，必须多放几句）----
  - 我刚从成都回来
  - 刚从厦门旅游回来
  - 我去了趟重庆
  - 打卡西安
  - 记录一下我去过的地方
  - 我旅行去过哪些城市
  - 我点亮了哪些城市
  - 这次去了哪些地方
  - 刚到拉萨，帮我记一下
  - 帮我把我走过的地方记下来
  - 我去过的地方有几个
  - 上个月去了成都和重庆
  - 我刚到哈尔滨
  - 前几天在武汉玩了下
  # ---- 记忆 / 偏好 ----
  - 帮我记住我不吃辣
  - 我之前说过什么偏好
  - 记一下我喜欢靠窗
  - 我的偏好都有哪些

travel:
  # ---- 行程规划 ----
  - 帮我规划三天行程
  - 帮我做个旅行计划
  - 这个假期去哪合适
  - 我想去个暖和的地方
  - 帮我安排一下周末的出行
  - 我打算出去玩几天
  - 帮我参考一下十一的安排
  # ---- 景点 / 美食 / 攻略（含"提了旅游但要攻略"的说法）----
  - 有什么好玩的地方推荐
  - 那边有什么好吃的
  - 推荐几个值得去的地方
  - 推荐个适合一个人放空的地方
  - 这个季节适合去哪
  - 有什么景点值得看
  - 大理有什么必吃的特色美食
  - 潮汕生腌好吃吗
  - 成都串串哪家好吃
  - 桂林阳朔漂流要多少钱
  - 重庆冬天冷不冷，穿什么合适
  - 去云南玩要准备什么
  - 西安兵马俑要买票吗
  - 南京旅游避雷
  - 去珠海旅游有什么注意事项吗
  - 给我一些南宁旅游的避坑指南
  - 出行需要注意什么
  # ---- 路线 / 陪人 / 场景 ----
  - 帮我看看路线怎么走
  - 想找个安静的地方待着
  - 有什么适合一个人去的地方
  - 带爸妈出门有什么建议
  - 想去海边玩

chat:
