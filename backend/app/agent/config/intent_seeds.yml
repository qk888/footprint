  - 今天天气真好
  - 我最近心情不好
  - 周末在家好无聊
  - 你在干什么
  - 谢谢你
  - 我刚看完一部电影
  - 明天要加班
  - 我养了只猫
  - 最近老是睡不好
  - 帮我推荐部电影
  - 我最近在看小说
  - 感觉时间过得真快
  - 好久没见朋友了
  - 你平时喜欢做什么
  - 说说你的看法
  - 讲个笑话
  - 你了解哪些国家
  - 你怎么知道这么多
