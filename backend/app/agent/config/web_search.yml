# 联网搜索（SearXNG）
#
# 什么时候用：本地知识库（3.4 万块维基导游）查不到、或者答完发现"资料里没写具体信息"时兜底。
# 本地能答的绝不联网 —— 上游有限流（实测连续快速请求会被压到只剩一个引擎有结果）。
enabled: true

# 容器内按 compose 的服务名访问；宿主机调试用 http://localhost:18888/search
base_url: http://searxng:8080/search

# 单次搜索超时（秒）。SearXNG 那边已经把上游压到 3~4 秒，这里留点余量
timeout: 8

# 取前几条摘要拼进参考资料（本地模型 4096 上下文，不能太多）
top_n: 6
snippet_len: 160

# 同一 query 的缓存时长（秒）—— 避免短时间重复打上游被限流
cache_ttl: 3600

# **空结果**的缓存时长（秒）。本地库真没有的信息会被反复问到（比如某个景点的门票），
# 不缓存就每次都去打上游 1~8 秒；但空结果也可能是上游临时抽风，所以只留 5 分钟
empty_cache_ttl: 300

language: zh-CN
